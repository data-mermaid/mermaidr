name: live-aggregate-tests

# Runs the aggregate-correctness tests in tests/testthat/test-mermaid_get_project_data.R
# (recalculate SU/SE values from the API's observations and compare them with the API's
# own SU/SE output) against the production API. They are skip_on_ci()'d in normal CI;
# CI=false / NOT_CRAN=true below un-skips them.
#
# Auth: an Auth0 machine-to-machine (client credentials) token whose MERMAID profile is a
# read-only member of the test projects, passed to mermaidr via MERMAID_TOKEN.
#
# Do not add pull_request / pull_request_target triggers: the M2M client secret must
# never be reachable from fork PRs.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
  # Sent by mermaid-api after a production deploy.
  repository_dispatch:
    types: [mermaid-api-deployed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live-aggregate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

      - name: Get MERMAID API token (Auth0 client credentials)
        shell: bash
        env:
          AUTH0_CLIENT_ID: ${{ secrets.MERMAID_M2M_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.MERMAID_M2M_CLIENT_SECRET }}
        run: |
          payload=$(jq -n --arg id "$AUTH0_CLIENT_ID" --arg secret "$AUTH0_CLIENT_SECRET" \
            '{grant_type: "client_credentials", client_id: $id, client_secret: $secret, audience: "https://api.datamermaid.org"}')
          token=$(curl -sS --fail https://datamermaid.auth0.com/oauth/token \
            -H "content-type: application/json" -d "$payload" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::No access token returned by Auth0"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "MERMAID_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run live aggregate tests
        shell: bash
        env:
          CI: "false" # un-skips skip_on_ci()
          NOT_CRAN: "true" # un-skips skip_on_cran()
        run: |
          run_tests() {
            Rscript -e 'testthat::test_local(filter = "mermaid_get_project_data|mermaid_get_summary_sampleevents", stop_on_failure = TRUE)'
          }
          # Retry once: SU/SE endpoints read the async summary cache, so an edit to a test
          # project mid-run can briefly disagree with the observations.
          run_tests || { echo "::warning::Live aggregate tests failed; retrying in 10 minutes"; sleep 600; run_tests; }

      - name: Open or update failure issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          title="Live aggregate tests failing"
          body="Aggregate-correctness tests failed against the production API (trigger: ${TRIGGER}). Run: ${RUN_URL}"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
